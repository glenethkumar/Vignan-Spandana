{% extends "base.html" %}

{% block title %}Error {{ code }} - Vignan Spandana{% endblock %}

{% block content %}
<div style="max-width: 620px; margin: 3rem auto;">
    <div class="card" style="border-top: 3px solid var(--secondary-red); text-align: center; padding: 3rem 2rem;">
        <div style="font-family: var(--font-serif); font-size: 3rem; font-weight: 700; color: var(--secondary-red); line-height: 1; margin-bottom: 0.75rem;">
            {{ code }}
        </div>
        <h2 style="margin-bottom: 0.75rem; color: var(--primary-navy); font-size: 1.4rem;">
            {{ title }}
        </h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5;">
            {{ description }}
        </p>
        <div>
            <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-primary" style="padding: 0.6rem 1.75rem;">
                &larr; Return to {{ 'Dashboard' if session.get('user_id') else 'Sign In' }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
